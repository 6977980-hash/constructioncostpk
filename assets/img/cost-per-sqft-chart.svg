<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 170" width="520" height="170" role="img" aria-labelledby="costChartTitle">
<title id="costChartTitle">Construction cost per square foot in Pakistan by quality tier, 2026 indicative rates</title>
<line x1="40" y1="140" x2="510" y2="140" stroke="#c7cedb" stroke-width="1.5"/>
<g font-family="sans-serif" font-size="10.5" fill="#556070">
  <rect x="45"  y="106" width="60" height="34"  fill="#9aa6b6"/>
  <rect x="130" y="94"  width="60" height="46"  fill="#7fa0e8"/>
  <rect x="215" y="78"  width="60" height="62"  fill="#1558d6"/>
  <rect x="300" y="56"  width="60" height="84"  fill="#0d3ea1"/>
  <rect x="385" y="30"  width="60" height="110" fill="#b9720f"/>
  <text x="75"  y="153" text-anchor="middle">Grey</text>
  <text x="160" y="153" text-anchor="middle">Economy</text>
  <text x="245" y="153" text-anchor="middle">Standard</text>
